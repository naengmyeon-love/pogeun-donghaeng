<text x="616" y="287.28" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" fill="#52627B">가능 / 보완 필요</text>
<text x="616" y="313.28" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" fill="#52627B">가능할 때만 확정</text>
<polyline points="840,276 876,276" fill="none" stroke="#9AAAC3" stroke-width="2"/>
<polygon points="876,276 866.9955289764732,280.3496553411123 866.9955289764732,271.6503446588877" fill="#9AAAC3"/>
<rect x="876" y="220" width="240" height="112" rx="16" fill="#FFFFFF" stroke="#DCE3EE"/>
<text x="892" y="254.64" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="21" fill="#17243B">I04 매칭 확정</text>
<text x="892" y="287.28" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" fill="#52627B">기관 담당자가 확정</text>
<text x="892" y="313.28" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" fill="#52627B">학생·튜터 안내</text>
