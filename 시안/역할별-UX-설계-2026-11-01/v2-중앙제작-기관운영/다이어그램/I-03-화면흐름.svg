<polygon points="600,276 590.9955289764732,280.3496553411123 590.9955289764732,271.6503446588877" fill="#9AAAC3"/>
<rect x="600" y="220" width="240" height="112" rx="16" fill="#FFF0E5" stroke="#DCE3EE"/>
