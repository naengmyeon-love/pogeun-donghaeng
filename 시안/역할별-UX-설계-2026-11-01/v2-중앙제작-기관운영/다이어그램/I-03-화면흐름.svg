<text x="64" y="787.28" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" fill="#52627B">수업 공백·접속 문제</text>
<polyline points="288,776 324,776" fill="none" stroke="#9AAAC3" stroke-width="2"/>
<polygon points="324,776 314.9955289764732,780.3496553411123 314.9955289764732,771.6503446588877" fill="#9AAAC3"/>
<rect x="324" y="720" width="240" height="112" rx="16" fill="#FFFFFF" stroke="#DCE3EE"/>
<text x="340" y="754.64" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="21" fill="#17243B">I07 기관 조치</text>
<text x="340" y="787.28" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" fill="#52627B">담당·기한·지원 기록</text>
<text x="340" y="813.28" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" fill="#52627B">미해결 사유 확인</text>
<polyline points="564,776 600,776" fill="none" stroke="#9AAAC3" stroke-width="2"/>
<polygon points="600,776 590.9955289764732,780.3496553411123 590.9955289764732,771.6503446588877" fill="#9AAAC3"/>
<rect x="600" y="720" width="240" height="112" rx="16" fill="#EDF0F5" stroke="#DCE3EE"/>
<text x="616" y="754.64" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="21" fill="#17243B">외부: 중앙 C10</text>
<text x="616" y="787.28" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" fill="#52627B">기관에서 해결 어려움</text>
<text x="616" y="813.28" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" fill="#52627B">운영 지원·자료 정정</text>
<polyline points="840,776 876,776" fill="none" stroke="#9AAAC3" stroke-width="2"/>
<polygon points="876,776 866.9955289764732,780.3496553411123 866.9955289764732,771.6503446588877" fill="#9AAAC3"/>
<rect x="876" y="720" width="240" height="112" rx="16" fill="#FFF0E5" stroke="#DCE3EE"/>
<text x="892" y="754.64" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="21" fill="#17243B">I07 결과 확인</text>
<text x="892" y="787.28" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" fill="#52627B">운영 재개 확인</text>
<text x="892" y="813.28" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" fill="#52627B">미해결은 재지원</text>
<polyline points="1116,776 1152,776" fill="none" stroke="#9AAAC3" stroke-width="2"/>
<polygon points="1152,776 1142.9955289764732,780.3496553411123 1142.9955289764732,771.6503446588877" fill="#9AAAC3"/>
<rect x="1152" y="720" width="240" height="112" rx="16" fill="#E7F6F1" stroke="#DCE3EE"/>
<text x="1168" y="754.64" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="21" fill="#17243B">I01 현황 반영</text>
<text x="1168" y="787.28" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" fill="#52627B">조치 결과 공유</text>
<text x="1168" y="813.28" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" fill="#52627B">학습 이해와 구분</text>
<text x="48" y="912.12" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" fill="#52627B">일반 매칭은 중앙 승인 없이 기관에서 확정합니다. 중앙은 전국 현황을 확인하고 필요한 지원을 제공합니다.</text>
<text x="48" y="959.44" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="16" fill="#52627B">실선: 구조·이동  ·  점선: 보완·재질문  ·  회색: 외부 역할  ·  연한 주황: 확인·분기  ·  초록: 처리 결과</text>
