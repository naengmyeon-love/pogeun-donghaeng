<polygon points="444.0,332 448.3496553411123,341.0044710235268 439.6503446588877,341.0044710235268" fill="#3158D5"/>
<rect x="490.0" y="353" width="360" height="28" rx="3" fill="#F5F7FC" stroke="#F5F7FC"/>
