<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980"><title>기관 · 화면 흐름도</title><desc>기관이 참여 확인·매칭 확정·수업 운영을 맡고, 중앙 자료와 운영 지원을 연결합니다.</desc><rect width="1440" height="980" fill="#F5F7FC"/>
<text x="48" y="46.28" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" fill="#52627B">포근동행  /  역할별 UX 설계  /  2026.11.01</text>
<text x="48" y="104.24" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="36" fill="#17243B">기관 · 화면 흐름도</text>
<text x="48" y="141.96" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="19" fill="#52627B">기관이 참여 확인·매칭 확정·수업 운영을 맡고, 중앙 자료와 운영 지원을 연결합니다.</text>
<polyline points="48,166 1392,166" fill="none" stroke="#DCE3EE" stroke-width="1"/>
<text x="48" y="197.64" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="21" fill="#3158D5">01  기관에서 튜터·학생 직접 매칭</text>
<rect x="48" y="220" width="240" height="112" rx="16" fill="#EAF0FF" stroke="#DCE3EE"/>
<text x="64" y="254.64" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="21" fill="#3158D5">I02 참여 학생</text>
<text x="64" y="287.28" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" fill="#52627B">I03 참여·동의 확인</text>
<text x="64" y="313.28" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" fill="#52627B">미완료는 보완 안내</text>
<polyline points="288,276 324,276" fill="none" stroke="#9AAAC3" stroke-width="2"/>
<polygon points="324,276 314.9955289764732,280.3496553411123 314.9955289764732,271.6503446588877" fill="#9AAAC3"/>
<rect x="324" y="220" width="240" height="112" rx="16" fill="#FFFFFF" stroke="#DCE3EE"/>
<text x="340" y="254.64" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="21" fill="#17243B">I04 후보 선택</text>
<text x="340" y="287.28" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" fill="#52627B">튜터 자격·과목</text>
<text x="340" y="313.28" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" fill="#52627B">시간·정원 확인</text>
