<polygon points="600,541 590.9955289764732,545.3496553411123 590.9955289764732,536.6503446588877" fill="#9AAAC3"/>
<rect x="600" y="485" width="240" height="112" rx="16" fill="#FFFFFF" stroke="#DCE3EE"/>
<text x="616" y="519.64" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="21" fill="#17243B">I09 클래스 연결</text>
<text x="616" y="552.28" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" fill="#52627B">해당 과목·차시 연결</text>
<text x="616" y="578.28" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" fill="#52627B">튜터에게 사용 안내</text>
<polyline points="840,541 876,541" fill="none" stroke="#9AAAC3" stroke-width="2"/>
<polygon points="876,541 866.9955289764732,545.3496553411123 866.9955289764732,536.6503446588877" fill="#9AAAC3"/>
<rect x="876" y="485" width="240" height="112" rx="16" fill="#EDF0F5" stroke="#DCE3EE"/>
<text x="892" y="519.64" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="21" fill="#17243B">외부: 튜터 T03</text>
<text x="892" y="552.28" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" fill="#52627B">공통 자료로 수업</text>
<text x="892" y="578.28" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" fill="#52627B">같은 자료로 복습 배정</text>
<polyline points="1116,541 1152,541" fill="none" stroke="#9AAAC3" stroke-width="2"/>
<polygon points="1152,541 1142.9955289764732,545.3496553411123 1142.9955289764732,536.6503446588877" fill="#9AAAC3"/>
<rect x="1152" y="485" width="240" height="112" rx="16" fill="#E7F6F1" stroke="#DCE3EE"/>
<text x="1168" y="519.64" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="21" fill="#17243B">I01 운영 현황</text>
<text x="1168" y="552.28" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" fill="#52627B">수신·사용 상태</text>
<text x="1168" y="578.28" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" fill="#52627B">중앙 현황에 반영</text>
<text x="48" y="697.64" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="21" fill="#3158D5">03  운영 지원과 중앙 협력</text>
