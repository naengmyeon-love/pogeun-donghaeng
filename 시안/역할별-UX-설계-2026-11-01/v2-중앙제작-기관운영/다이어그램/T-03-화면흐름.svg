<polyline points="1116,771 1152,771" fill="none" stroke="#9AAAC3" stroke-width="2"/>
<polygon points="1152,771 1142.9955289764732,775.3496553411123 1142.9955289764732,766.6503446588877" fill="#9AAAC3"/>
<rect x="1152" y="715" width="240" height="112" rx="16" fill="#E7F6F1" stroke="#DCE3EE"/>
<text x="1168" y="749.64" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="21" fill="#17243B">T06·T08 후속</text>
<text x="1168" y="782.28" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" fill="#52627B">재질문은 답변 대기</text>
<text x="1168" y="808.28" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" fill="#52627B">보충은 다음 수업</text>
<text x="48" y="906.12" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" fill="#52627B">튜터의 자료 제작·승인 요청 흐름은 없습니다. 수업 메모와 보충 설명은 중앙 배포 원본과 구분합니다.</text>
<text x="48" y="959.44" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="16" fill="#52627B">실선: 구조·이동  ·  점선: 보완·재질문  ·  회색: 외부 역할  ·  연한 주황: 확인·분기  ·  초록: 처리 결과</text>
