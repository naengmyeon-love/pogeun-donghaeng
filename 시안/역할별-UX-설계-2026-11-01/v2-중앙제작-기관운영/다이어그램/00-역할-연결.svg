<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980"><title>중앙 제작 · 기관 운영 · 학습의 연결</title><desc>중앙이 공통 자료와 품질을 관리하고, 기관이 매칭과 현장 운영을 책임집니다.</desc><rect width="1440" height="980" fill="#F5F7FC"/>
