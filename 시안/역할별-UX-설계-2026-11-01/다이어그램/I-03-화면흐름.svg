<text x="1168" y="787.28" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" fill="#52627B">운영 조치 상태 갱신</text>
<text x="1168" y="813.28" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" fill="#52627B">학습 이해와 구분</text>
<text x="48" y="912.12" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" fill="#52627B">기관 조치 완료 ≠ 학생 이해 완료 · 기관은 최종 매칭·자료 배포 권한을 자동으로 갖지 않습니다.</text>
<text x="48" y="959.44" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="16" fill="#52627B">실선: 구조·이동  ·  점선: 보완·재질문  ·  회색: 외부 역할  ·  연한 주황: 확인·분기  ·  초록: 처리 결과</text>
