<text x="502.0" y="624.44" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="16" fill="#3158D5">아직 어려움 → 같은 질문에 이어 묻기</text>
<rect x="48" y="837" width="1344" height="83" rx="16" fill="#EAF0FF" stroke="#EAF0FF"/>
<text x="66" y="866.96" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="19" fill="#3158D5">예외와 상태</text>
<text x="66" y="895.28" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" fill="#52627B">매칭 전: G01 참여 안내 → 기관 도움 / 제출 실패: 입력 유지·재시도 / 답변 도착은 이해 완료가 아닙니다.</text>
<text x="48" y="759.96" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="19" fill="#52627B">빠른 길: S01의 수업·복습·답변 카드는 각각 S03·S04·S06으로 바로 연결됩니다.</text>
<text x="48" y="796.96" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="19" fill="#52627B">복습은 질문 없이도 완료할 수 있고, 답변을 본 뒤에도 같은 문항을 다시 풀 수 있습니다.</text>
<text x="48" y="959.44" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="16" fill="#52627B">실선: 구조·이동  ·  점선: 보완·재질문  ·  회색: 외부 역할  ·  연한 주황: 확인·분기  ·  초록: 처리 결과</text>
