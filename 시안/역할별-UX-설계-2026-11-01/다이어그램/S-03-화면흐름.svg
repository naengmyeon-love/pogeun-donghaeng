<polyline points="996.0,587 996.0,619 168.0,619 168.0,587" fill="none" stroke="#3158D5" stroke-width="2" stroke-dasharray="6 6"/>
<polygon points="168.0,587 172.3496553411123,596.0044710235268 163.6503446588877,596.0044710235268" fill="#3158D5"/>
