const approval=()=>`${heading('공통 자료 검토','수업에서 함께 쓸 자료의 기준과 정답을 확인합니다.','교과 검토자 / 자료 검토·배포')}${subj()}${controls('자료 검토 상태','approval',[['review','검토 중'],['revision','수정 요청'],['approved','승인·새 버전 발행 후']])}<div class="status-strip"><b>${l().id} · 다음 배포 후보 ${state.subject==='math'?'v1.3':'v1.1'}</b><span>기존 승인본 ${l().version} 유지</span><span>${{review:'교과 검토 중',revision:'작성자 수정 대기',approved:'새 버전 승인 완료'}[state.approval]}</span></div><div class="split"><div class="stack"><section class="card"><h3>검토 대상${n(1)}</h3><h2 class="mt">${l().title}</h2><div class="meta mt"><span>2022 개정</span><span>5~6학년군</span><span>[${l().code}]</span><span>작성자: 대학생 튜터 · 예시</span></div><div class="rule"></div><div class="pill-group"><span class="pill selected">학생 자료</span><span class="pill">튜터 지도안</span><span class="pill">복습·정답</span></div><div class="review-highlight mt"><h4>개정 후보에서 달라진 부분</h4><p class="small muted mt">${state.subject==='math'?'분수 막대 설명을 보완하고, 복습 Q03의 힌트 표현을 정리한 예시입니다.':'일상 대화의 설명을 보완하고, 복습 Q02의 질문 표현을 정리한 예시입니다.'}</p></div><h4 class="mt">검토 메모</h4><div class="field multiline mt">핵심 개념과 예시의 연결, 정답·풀이의 일치 여부를 확인합니다.<br>직접적인 답 노출 없이 힌트가 이해를 돕는지 검토합니다.</div><div class="note mt">검토 문구와 완료 표시는 상태 배치 예시입니다. 실제 콘텐츠 검증 결과가 아닙니다.</div></section><section class="card"><h3>버전 연결 원칙${n(2)}</h3><div class="table-scroll"><table class="content-table mt"><thead><tr><th>사용처</th><th>배정 버전</th><th>개정 후 처리</th></tr></thead><tbody><tr><td>이미 진행한 수업</td><td>${l().version}</td><td>당시 자료 유지</td></tr><tr><td>기존 복습·질문</td><td>${l().version} · ${l().ref}</td><td>당시 문항·맥락 유지</td></tr><tr><td>새 수업 배정</td><td>승인된 ${state.subject==='math'?'v1.3':'v1.1'}</td><td>담당 튜터가 새 버전 선택</td></tr></tbody></table></div></section></div><aside class="stack align-start"><section class="card soft"><h3>교과 검토 항목${n(3)}</h3>${['고시·성취기준 원문 대조','개념과 설명의 정확성','문항·정답·풀이 일치','초5 표현·난이도 적합성','학생 자료·지도안·복습 연결','출처·이용권리·접근성 확인'].map(t=>`<div class="checkline"><span class="fake-check">${state.approval==='approved'?'✓':''}</span>${t}</div>`).join('')}<div class="rule"></div><label class="label">검토 책임</label><div class="field small">교과 검토자 · 성명·일시 기록 자리</div><div class="mt stack" style="gap:9px">${act('검토 후 승인·배포','승인된 새 버전만 공통 자료실에 노출됩니다. 실제 배포나 파일 생성은 하지 않습니다.','primary full')}${act('작성자에게 수정 요청','작성자 수정 대기 상태의 예시는 위에서 선택할 수 있습니다. 실제 요청은 보내지 않습니다.','full')}</div></section>${state.approval!=='review'?`<section class="card dashed"><h4>${state.approval==='approved'?'새 버전 발행 완료 · 예시':'수정 요청 · 예시'}</h4><p class="small muted mt">${state.approval==='approved'?'공통 자료실에서 새 수업에 배정할 수 있습니다. 기존 질문의 자료 버전 연결은 유지합니다.':'힌트 표현을 보완한 뒤 다시 검토를 요청합니다. 승인 전 학생 배정은 불가합니다.'}</p></section>`:''}</aside></div>`;
const adminMatching=()=>`${heading('학생과 튜터 연결하기','활동 가능 지역·과목·시간과 확인 상태를 바탕으로 배정합니다.','운영자 / 매칭 관리')}<div class="grid3 mb"><div class="card"><span class="small muted">매칭 검토 대기</span><div class="metric">3 <small>건 · 예시</small></div></div><div class="card"><span class="small muted">일정 확인 중</span><div class="metric">2 <small>건 · 예시</small></div></div><div class="card"><span class="small muted">대체 지원 요청</span><div class="metric">1 <small>건 · 예시</small></div></div><div class="split"><div class="stack"><section class="card"><h3>매칭 요청 · 지우${n(1)}</h3><div class="info-pair mt"><span>대상</span><b>초등학교 5학년 · 가상 학생</b></div><div class="info-pair"><span>신청 과목</span><span>수학 · 영어 / 수학 우선 검토</span></div><div class="info-pair"><span>활동 기관</span><span>○○군 동행 배움터 · 가상 기관</span></div><div class="info-pair"><span>가능 시간</span><span>화 · 목 오후 4시 이후</span></div><div class="rule"></div><div class="note">상세 주소·개인 연락처는 후보 튜터 탐색 화면에 표시하지 않습니다.</div></section><section class="card"><div class="between"><h3>확인된 튜터 후보</h3>${tag('수학 · 활동 지역 일치')}</div><div class="row mt"><div class="avatar">민서</div><div><h3>민서 · 대학생 튜터</h3><p class="small muted">○○대학교 · 활동 가능 화요일 오후 4시</p></div></div><div class="rule"></div><div class="info-pair"><span>연결 근거</span><span>과목 적합성 · 활동 지역 · 시간 일치</span></div><div class="info-pair"><span>일정 확인</span><span>학생·보호자·기관·튜터 확인 상태 점검</span></div><div class="mt">${act('배정 제안·일정 확인','운영자가 관련자의 일정 확인을 진행하는 동선입니다. 실제 알림이나 배정은 하지 않습니다.','compact')}</div></section><section class="card dashed"><h3>변경·대체도 이력과 함께${n(3)}</h3><p class="small muted mt">튜터 변경 시 담당 과목과 권한을 다시 배정하고, 기존 자료·복습·미답변 질문을 새 담당자에게 연결합니다.</p></section></div><aside class="stack align-start"><section class="card soft"><h3>확정 전 확인${n(2)}</h3>${['보호자·기관의 학생 이용 확인','튜터 신원·활동 자격 등 확인','활동 시간과 장소 합의','튜터의 일정 수락','공통 자료·수업 운영 안내'].map(t=>`<div class="checkline"><span class="fake-check"></span>${t}</div>`).join('')}<div class="note mt">체크는 배치 예시입니다. 실제 확인 절차·증빙은 수행하지 않습니다.</div><div class="mt">${act('확인 후 매칭 확정','확정 후에는 학생의 ‘매칭 확정’ 상태와 클래스룸이 열립니다. 실제 배정은 하지 않습니다.','primary full')}</div><div class="mt">${btn('학생에게 보일 화면','S02','full')}</div></section><section class="card dashed"><h4>운영 지원</h4><p class="small muted mt">접속 어려움·미답변 질문·튜터 부재는 기관과 운영자가 확인합니다.</p></section></aside></div>`;
const views={O01:overview,S01:studentHome,S02:matching,S03:classroom,S04:review,S05:studentQuestion,T01:tutorHome,T02:tutorClass,T03:tutorQuestions,C01:library,C02:createMaterial,A01:approval,A02:adminMatching};
const roleNames={overview:'서비스 구조',student:'학생',tutor:'대학생 튜터',reviewer:'교과 검토자',operator:'운영자'};
const productNav={overview:[['전체 흐름','O01'],['학생 화면','S01'],['튜터 화면','T01'],['공통 자료','C01']],student:[['오늘의 학습','S01'],['내 클래스룸','S03'],['온라인 복습','S04'],['질문과 답변','S05'],['튜터 매칭','S02']],tutor:[['대시보드','T01'],['수업 준비','T02'],['질문함','T03'],['공통 학습자료','C01']],reviewer:[['자료 검토·배포','A01'],['매칭 운영 보기','A02']],operator:[['매칭 관리','A02'],['자료 검토 보기','A01']]};
let toastTimer;
function toast(message){const el=document.getElementById('toast');clearTimeout(toastTimer);el.textContent=message;el.classList.remove('hidden');toastTimer=setTimeout(()=>el.classList.add('hidden'),6500)}
function renderNav(){let prev='';document.getElementById('screen-nav').innerHTML='<div class="nav-intro">SCREEN INDEX <b>13</b><br>메뉴를 눌러 화면을 비교하세요.</div>'+screens.map(s=>{const label=prev!==s.group?`<div class="nav-label">${s.group}</div>`:'';prev=s.group;return label+`<a class="screen-link ${state.screen===s.id?'active':''}" href="#${s.id}" ${state.screen===s.id?'aria-current="page"':''}><span class="code">${s.id}</span><span>${s.title}</span></a>`}).join('')+'<div class="nav-footer">공통 자료 → 수업 → 복습 → 질문<br>2026.10.31 · 로컬 검토본<br>색상·일러스트·브랜드 UI 확정 전</div>';document.getElementById('screen-select').innerHTML=screens.map(s=>`<option value="${s.id}" ${state.screen===s.id?'selected':''}>${s.id} ${s.title}</option>`).join('')}
function render(){const s=screens.find(s=>s.id===state.screen)||screens[1];document.title=`${s.id} ${s.title} · 포근동행 와이어프레임`;renderNav();document.getElementById('canvas-label').innerHTML=`<span>${s.id} / ${roleNames[s.role]} · ${s.title}</span>`;document.getElementById('screen-count').textContent=`${String(screens.indexOf(s)+1).padStart(2,'0')} / 13`;
 const nav=productNav[s.role];document.getElementById('product').innerHTML=`<header class="product-header"><div class="product-brand">${mark}<span>포근동행</span></div><span class="badge outline">${roleNames[s.role]}</span><div class="persona"><span>${s.role==='student'?'지우 · 초등학교 5학년':s.role==='tutor'?`${l().tutor.replace(' 선생님','')} · ${l().subject} 튜터`:s.role==='overview'?'배움의 연결을 위한 설계':'역할별 업무 공간'}<br><span class="muted">가상 화면 예시</span></span><div class="avatar">${s.role==='student'?'지우':s.role==='tutor'?l().tutor.replace(' 선생님',''):'동행'}</div></div></header><nav class="product-nav" aria-label="서비스 메뉴">${nav.map(([t,id])=>`<a href="#${id}" class="${s.id===id||(s.id==='C02'&&id==='C01')?'active':''}" ${s.id===id?'aria-current="page"':''}>${t}</a>`).join('')}</nav><div class="page ${s.id==='O01'?'overview':''}">${views[s.id]()}</div><footer class="product-footer"><span>포근동행 · 지역과 함께 잇는 배움</span><span>와이어프레임 / 실제 데이터·콘텐츠 아님</span></footer>`;
 document.getElementById('annotations').innerHTML=`<div class="annotations-inner"><div class="annotations-intro"><div class="eyebrow">Design notes / ${s.id}</div><h2>${s.purpose}</h2><p class="intro">화면의 번호와 설명을 함께 보세요.</p></div>${s.notes.map(([title,body],i)=>`<div class="annotation"><span class="num">${i+1}</span><div><b>${title}</b>${body}</div></div>`).join('')}<div class="annotation-section"><h3>설계 가정 · 검토할 점</h3><p>${s.decision}</p></div></div>`;
}
function navigate(id){if(!screens.some(s=>s.id===id))return;if(location.hash!==`#${id}`){location.hash=id}else{state.screen=id;render()}window.scrollTo({top:0,behavior:'instant'})}
document.addEventListener('click',e=>{const skip=e.target.closest('.skip');if(skip){e.preventDefault();document.getElementById('main-content').focus();return}const screen=e.target.closest('[data-screen]');if(screen){if(screen.dataset.question)state.question=screen.dataset.question;navigate(screen.dataset.screen);return}const subject=e.target.closest('[data-subject]');if(subject){state.subject=subject.dataset.subject;render();return}const note=e.target.closest('[data-note]');if(note)toast(note.dataset.note)});
document.addEventListener('change',e=>{if(e.target.id==='screen-select')navigate(e.target.value);if(e.target.dataset.state){state[e.target.dataset.state]=e.target.value;render()}});
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);state.screen=screens.some(s=>s.id===id)?id:'S01';render();window.scrollTo({top:0,behavior:'instant'})});
state.screen=screens.some(s=>s.id===location.hash.slice(1))?location.hash.slice(1):'S01';render();
</script>
